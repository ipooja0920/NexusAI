# =====================================================================
# NexusAI Faculty-Company Matching - Configuration
# All paths are relative to this project folder unless absolute.
# =====================================================================

paths:
  companies_raw: data/companies_raw.xlsx          # Capital IQ export (you provide)
  companies_enriched: data/companies_enriched.xlsx # generated by enrich_companies.py
  faculty_database: data/Faculty Database.xlsx     # faculty list with Flag column
  output_dir: data/output                          # per-faculty result workbooks
  cache_dir: data/cache                            # geocode / embedding / score caches

# --------- Capital IQ export layout (same as screening reports) ------
capitaliq:
  header_row: 8         # row with column headers ("Company Name", ...)
  data_start_row: 9     # first data row
  col_company: A
  col_employees: C
  col_revenue: D        # $USDmm
  col_address: G        # "Offices" block
  col_description: I
  col_website: J

# --------- Faculty Database layout -----------------------------------
faculty:
  header_row: 1         # headers: Faculty | School/College | Department |
                        # Research Description | Industry Classification1 |
                        # Industry Classification2 | Flag
  data_start_row: 2
  col_name: A
  col_school: B
  col_department: C
  col_research: D
  col_class1: E
  col_class2: F
  col_flag: G

# --------- OpenAI ----------------------------------------------------
openai:
  scoring_model: gpt-5-nano
  embedding_model: text-embedding-3-small
  max_retries: 3
  rate_limit_seconds: 0.0     # pause between scoring calls (0 = none)

# --------- Pre-filter (embedding similarity) -------------------------
prefilter:
  enabled: true
  top_n_candidates: 300   # companies passed to LLM scoring per faculty
                          # set to 0 to disable and score ALL companies

# --------- Scoring funnel --------------------------------------------
funnel:
  secondary_cutoff: 40    # top-N companies that get partnership/funding scoring
  final_top_n: 20         # companies written to the output workbook

# --------- Score weights (must sum to 1.0) ---------------------------
weights:
  distance: 0.25
  employees: 0.05
  revenue: 0.15
  alignment: 0.30
  partnership: 0.15
  funding: 0.10

# --------- Component score parameters --------------------------------
components:
  # distance score = exp(-miles / distance_decay); blank address -> 0
  distance_decay: 400.0
  # employee score = min(1, employees / employee_cap)
  employee_cap: 1000
  # revenue score: 0 at rev_low_zero, 1.0 between rev_low_full..rev_high_full,
  # back to 0 at rev_high_zero (all $USDmm). Missing revenue -> rev_missing_score.
  revenue:
    rev_low_zero: 0.0
    rev_low_full: 30.0
    rev_high_full: 60.0
    rev_high_zero: 1000.0
    rev_missing_score: 0.5

# --------- Geocoding -------------------------------------------------
geocoding:
  reference_point: [41.8073, -72.2536]   # UConn Storrs
  nominatim_user_agent: "NexusAI-UConn-Matching/1.0"
  rate_limit_seconds: 1.05
