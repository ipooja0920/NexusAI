# =====================================================================
# NexusAI Faculty-Company Matching - Configuration
# All paths are relative to this project folder unless absolute.
# =====================================================================

# Each folder under data/ holds one KIND of file, so it is always obvious
# where something belongs and what is safe to delete:
#   input/    files YOU provide             - never written by the programs
#   sources/  data downloaded from outside  - re-downloadable (SEC, OpenAlex)
#   cache/    data WE computed              - delete to force a rebuild
#   review/   spreadsheets for eyeballing match quality
#   output/   the final per-faculty results
# companies_enriched.xlsx sits at the top of data/ rather than in a
# subfolder because it is the hand-off between enrichment and matching,
# not the property of either stage.
paths:
  companies_raw: data/input/companies_raw.xlsx       # Capital IQ export (you provide)
  faculty_database: data/input/Faculty Database.xlsx # faculty list with Flag column
  # BD-IFR Faculty Registration form export: run one with --row N or --faculty
  faculty_registration: data/input/BDIFR Faculty Registration From-documents.csv
  companies_combined: data/companies_combined.xlsx   # raw + source data, built by combine_companies.py
  companies_enriched: data/companies_enriched.xlsx   # built by enrich_companies.py
  sources_dir: data/sources                          # downloaded reference data
  cache_dir: data/cache                              # geocode / embedding / score caches
  review_dir: data/review                            # name-match review workbooks
  output_dir: data/output                            # per-faculty result workbooks
  # faculty scholarly contributions exports (Name, Title, Type, Year read);
  # one CSV per faculty or several in one file - matched by Name
  publications: data/input/publications

# --------- Capital IQ export layout (same as screening reports) ------
capitaliq:
  header_row: 8         # row with column headers ("Company Name", ...)
  data_start_row: 9     # first data row
  col_company: A
  col_ticker: B         # "NasdaqCM:ACET"; blank for private companies
  col_industry: C       # "Industry Classifications"
  col_company_type: D   # "Public Company" / "Private Company"
  col_employees: F
  col_revenue: G        # $USDmm
  col_address: I        # "Offices" block
  col_description: K
  col_website: L
  col_status: M         # "Company Status": Operating / Operating Subsidiary / Acquired / ...

# --------- Faculty Database layout -----------------------------------
faculty:
  header_row: 1         # headers: Faculty | School/College | Department |
                        # Research Description | Industry Classification1 |
                        # Industry Classification2 | Flag
  data_start_row: 2
  col_name: A
  col_school: B
  col_department: C
  col_research: D
  col_class1: E
  col_class2: F
  col_flag: G

# --------- OpenAI ----------------------------------------------------
openai:
  scoring_model: gpt-5-nano
  embedding_model: text-embedding-3-small
  max_retries: 3
  rate_limit_seconds: 0.0     # pause between scoring calls (0 = none)
  concurrency: 16             # AI calls in flight at once (lower it if you
                              # hit OpenAI rate-limit errors)
  profile_model:              # model for the company profiles; blank = scoring_model
  # each company's alignment is asked this many times and the middle score
  # is used: one ask can swing by several points (8 one run, 4 the next)
  alignment_votes: 3

# --------- Pre-filter (embedding similarity) -------------------------
prefilter:
  enabled: true
  top_n_candidates: 300   # companies passed to LLM scoring per faculty
                          # set to 0 to disable and score ALL companies
  # registration-form faculty: each keyword and the industry-interests note
  # are searched on their own and ADD up to this many companies each on top
  # of the 300 (the 300 from the full profile are never reduced)
  extra_per_search: 30
  # true = small companies are AI-scored ALL, not just the most similar
  # (hours of AI calls). Default off: the pre-filter keeps every candidate
  # relevant. One run can opt in with --full.
  full_run: false

# --------- Faculty publications ---------------------------------------
# weight = age weight x type weight; recent work counts most, older still counts
publications:
  age_weights: [[5, 1.0], [10, 0.6], [15, 0.4]]   # up to N years old -> weight
  older: 0.25                 # older than the last step
  no_year: 1.0                # no year = forthcoming
  type_weights: {journal erratum: 0.0, erratum: 0.0, poster: 0.5, presentation: 0.5}
  prompt_titles: 12           # top titles by weight the AI reads

# --------- Company size tiers (revenue, $USDmm) ----------------------
# Each faculty's output ranks companies separately per tier, one tab each.
# Small = under small_below, or no revenue figure; Large = large_from and up.
size_tiers:
  small_below: 100
  large_from: 1000

# --------- Scoring funnel --------------------------------------------
funnel:
  secondary_cutoff: 100   # top-N per tab that get the partnership score
  final_top_n: 50         # companies listed in each size tab
  # optional floor: only companies with an AI alignment score of at least
  # this reach the partnership step and a tab (0 = off). Per size tier:
  # Mid and Large have few companies, so without a floor unrelated ones
  # (gene editing, oncology) fill their tabs.
  min_alignment: 0
  min_alignment_by_tier: {Small: 0, Mid: 4, Large: 4}
  # an NA partnership answer ("not known") counts as this, after the 1-9
  # scores are scaled to 0-1 - neutral, not the lowest score
  partnership_missing: 0.5
  # Capital IQ "Company Status" values left out of every tab
  exclude_status: [Acquired, Out of Business, Liquidating]

# --------- Score weights (must sum to 1.0) ---------------------------
weights:
  distance: 0.25
  employees: 0.05
  revenue: 0.15
  alignment: 0.30
  partnership: 0.15
  funding: 0.10

# --------- Component score parameters --------------------------------
components:
  # distance score = exp(-miles / distance_decay); blank address -> 0
  distance_decay: 400.0
  # employee score = min(1, employees / employee_cap)
  employee_cap: 1000
  # revenue score - SIZE fit, in $USDmm. The target is an established
  # company with a budget that still needs outside research: full marks
  # $100m - $1bn, tapering to big_floor at $5bn, where it stays (the giants
  # rarely need UConn, but they do sometimes sponsor). Small companies are
  # not knocked out here - they earn their place through the funding score.
  revenue:
    small_max: 5             # under $5m       -> small_score
    small_score: 0.2
    mid_score: 0.4           # $5m - $100m     -> mid_score
    sweet_lo: 100            # $100m - $1bn    -> 1.0
    sweet_hi: 1000
    big_hi: 5000             # $1bn -> $5bn    : 1.0 down to big_floor
    big_floor: 0.2
    missing_score: 0.5       # no revenue figure -> neutral

# --------- Combining sources onto Capital IQ ------------------------
combine:
  # Form D money counts as "recent" from this date up to the newest filing
  # in the download. Startups raise enough for 18-24 months, so a round from
  # early 2025 is very likely still in the bank.
  formd_recent_from: 2025-01-01

# --------- Funding score ---------------------------------------------
# "Is there money available NOW?" - arithmetic over figures from filings,
# no AI. Each signal reads 0.0 at `lo` and 1.0 at `hi` on a LOG scale (the
# figures span five orders of magnitude), and the BEST signal counts: two
# kinds of money are the same answer, not twice the answer. All $ millions.
#
# How low the floors go: a typical company-sponsored university project is
# roughly $100k-$300k a year, which a company can carry with about $5m+ of
# R&D, $10m+ in the bank, or a recent multi-million raise.
funding:
  signals:
    formd_recent:   {lo: 0.5, hi: 20}    # Form D money raised since 2025
    cash_total:     {lo: 5,   hi: 100}   # SEC cash + short-term investments
    rd_expense:     {lo: 1,   hi: 50}    # SEC R&D spend, latest year
    sbir_active:    {lo: 0.1, hi: 2}     # SBIR/STTR awards still running -
                                         # tied to a project, but a legal
                                         # route for paying a university
  # OpenAlex: a university wrote papers this company funded, in this year
  # or later -> it is paying academics now -> full marks
  oa_funded_from: 2025
  # A figure is trusted by the year it describes: older money shrinks
  # TOWARDS neutral (never below what no figure at all would score).
  recency:
    fresh_year: 2025          # this year or later -> full weight
    fresh: 1.0
    recent: 0.6               # the year before
    stale: 0.25               # older
  # No money signal at all -> neutral: absence of a filing is not poverty.
  missing_score: 0.5
  # Raised private money at some point (Form D "Yes") but nothing recent:
  # a small plus, only for companies with no revenue or under $100m.
  formd_raised_bonus: 0.05
  formd_raised_revenue_max: 100
  # SEC R&D sanity check: for a company with at least revenue_min ($USDmm)
  # revenue, an R&D figure under min_share of revenue is not its R&D budget
  # (SEC's standard tag sometimes holds a small item - J&J shows $109m
  # against ~$98bn revenue) - so it is ignored, and the reason says so
  rd_sanity:
    revenue_min: 1000
    min_share: 0.005

# --------- Academic track record --------------------------------------
# Data-driven adjustment ADDED to the partnership score (0-1 after
# normalising). Past ties show the company knows how to work with a
# university; a CURRENT partner leaves less room for UConn.
academic:
  bonus:
    oa_funded_university: 0.10     # paid for papers a university wrote
    sbir_university_past: 0.05     # past SBIR/STTR research partner
    ct_university_past: 0.05       # past clinical-trial partner
    oa_coauthored_university: 0.05 # its staff wrote papers with one
    sbir_awarded: 0.03             # has done federally funded R&D
  bonus_cap: 0.15
  penalty:
    sbir_university_current: -0.05 # STTR partner on a running award
    ct_university_current: -0.05   # partner on a running trial
  penalty_cap: -0.10
  # Running clinical trials: off by default (0.0) - trial sponsors are
  # research-active companies with money. To penalise only very large trial
  # portfolios, set a negative value and a threshold, e.g. -0.05 above 10.
  ct_active_penalty: 0.0
  ct_active_above: 10

# --------- Geocoding -------------------------------------------------
geocoding:
  reference_point: [41.8073, -72.2536]   # UConn Storrs
  nominatim_user_agent: "NexusAI-UConn-Matching/1.0"
  rate_limit_seconds: 1.05
